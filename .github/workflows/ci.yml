name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  compatibility:
    name: verify (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Init
        run: make init
      - name: Verify
        run: make verify

  verify:
    runs-on: ubuntu-latest
    needs: compatibility
    if: ${{ always() }}
    steps:
      - name: Confirm compatibility checks passed
        run: test "${{ needs.compatibility.result }}" = "success"
