rules:
  - id: ai-agents-metrics.controller-persistence-call
    languages: [python]
    severity: ERROR
    message: >-
      Command handlers must not execute persistence operations. Move the operation behind an
      application port and compose its adapter in runtime_facade.
    paths:
      include:
        - "**/commands/*.py"
    pattern-either:
      - pattern: $CONNECTION.execute(...)
      - pattern: $CONNECTION.executemany(...)
      - pattern: $CONNECTION.executescript(...)

  - id: ai-agents-metrics.controller-warehouse-schema
    languages: [python]
    severity: ERROR
    message: >-
      Command handlers must not know warehouse schema names. Keep schema knowledge and row
      mapping inside a persistence adapter.
    paths:
      include:
        - "**/commands/*.py"
    pattern-regex: >-
      (?i)(FROM|JOIN|INTO|UPDATE|TABLE)\s+(raw|normalized|derived)_[a-z0-9_]+

  - id: ai-agents-metrics.command-broad-runtime
    languages: [python]
    severity: ERROR
    message: >-
      Command handlers must use an approved narrow operation-specific runtime protocol.
    paths:
      include:
        - "**/commands/*.py"
    patterns:
      - metavariable-regex:
          metavariable: $HANDLER
          regex: ^handle_
      - metavariable-regex:
          metavariable: $RUNTIME_TYPE
          regex: >-
            ^(?!(HistoryIngestRuntime|HistoryNormalizeRuntime|HistoryClassifyRuntime|HistoryDeriveRuntime|HistoryUpdateRuntime|ShowRuntime|PublicBoundaryRuntime|ReportRuntime|object)$).+$
      - pattern: |
          def $HANDLER($ARGS: $ARGS_TYPE, $RUNTIME: $RUNTIME_TYPE) -> $RETURN:
              ...

  - id: ai-agents-metrics.command-runtime-any-return
    languages: [python]
    severity: ERROR
    message: >-
      Runtime protocol methods must return a concrete boundary type instead of Any.
    paths:
      include:
        - "**/commands/*.py"
    patterns:
      - pattern-inside: |
          class $PROTOCOL(..., Protocol, ...):
              ...
      - pattern-either:
          - pattern: |
              def $METHOD(...) -> Any:
                  ...
          - pattern: |
              def $METHOD(...) -> typing.Any:
                  ...

  - id: ai-agents-metrics.application-direct-io
    languages: [python]
    severity: ERROR
    message: >-
      Application code must use a port instead of direct database, filesystem, process, or
      network I/O.
    paths:
      include:
        - "**/application.py"
        - "**/application/**/*.py"
    pattern-either:
      - pattern: sqlite3.connect(...)
      - pattern: $PATH.read_text(...)
      - pattern: $PATH.write_text(...)
      - pattern: open(...)
      - pattern: subprocess.run(...)
      - pattern: subprocess.Popen(...)

  - id: ai-agents-metrics.concrete-adapter-outside-runtime-facade
    languages: [python]
    severity: ERROR
    message: >-
      Concrete warehouse adapters may be imported only by runtime_facade composition modules.
      Depend on warehouse application ports everywhere else.
    paths:
      include:
        - "**/*.py"
      exclude:
        - "**/runtime_facade/*.py"
        - "**/warehouse/adapters/*.py"
    pattern-either:
      - pattern: from ai_agents_metrics.warehouse.adapters import $NAME
      - pattern: from ai_agents_metrics.warehouse.adapters.$MODULE import $NAME
      - pattern: import ai_agents_metrics.warehouse.adapters
      - pattern: import ai_agents_metrics.warehouse.adapters.$MODULE
